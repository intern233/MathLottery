[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mathlottery"
version = "0.1.0"
description = "Find, solve and verify mathematics with Chat API or Codex agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12,<1", "pydantic>=2.8,<3", "httpx>=0.27,<1",
  "PyYAML>=6,<7", "beautifulsoup4>=4.12,<5", "sympy>=1.13,<2",
]

[project.scripts]
mathlottery = "mathlottery.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
research = ["numpy>=1.26,<3", "scipy>=1.12,<2", "matplotlib>=3.8,<4", "pypdf>=5,<7"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
