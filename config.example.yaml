# 复制为 config.yaml，在这里选择模型；运行命令只需指定研究任务。
backend:
  # codex：官方 Codex 会话；chat：OpenAI Responses API。
  mode: codex
  model: gpt-6-astra
  reasoning_effort: max
  chat:
    # 仅 mode: chat 时生效；可选 pro、standard，null 使用 API 默认值。
    reasoning_mode: pro
    api_key_env: OPENAI_API_KEY
    base_url: https://api.openai.com/v1
    poll_interval_seconds: 1
    request_timeout_seconds: 30
    tools:
      - type: web_search
      - type: code_interpreter
        container:
          type: auto

  # 以下为运行设置。model / reasoning_effort 改为 null 可继承 Codex 用户配置。
  execution: native
  codex_command: codex
  codex_profile: null
  # null uses the remaining total budget for a native turn.
  native_turn_timeout_seconds: null
  native_web_search: live
  native_network_access: true
  # null inherits the isolated Codex configuration/runtime defaults; false keeps one agent.
  native_multi_agent: null
  # Research only; independent reviewers always disable memories.
  native_memories: null
  native_max_log_bytes: 100000000
  # Legacy structured calls only:
  timeout_seconds: 300
  max_retries: 2
discovery:
  # Frozen Find dossier passed to a user-selected Solve task; skipped files are reported.
  context_max_files: 300
  context_max_file_bytes: 8000000
  context_max_total_bytes: 32000000
  # Hosted Chat cannot read local files; send text inline once, with explicit omissions.
  chat_context_max_bytes: 256000
resources:
  # Shared by CLI and browser research jobs in this workspace, including after server restart.
  max_concurrent_runs: 1
  # Independent attached-source checks only; native agent-launched Lean stays inside its run.
  max_concurrent_formal: 1
  # Sampled local process-tree RSS: cooperative stop, NOT a hard memory quota.
  memory_soft_limit_mb: null
  # Wait before starting when Linux MemAvailable is below this threshold; 0 disables the gate.
  min_available_memory_mb: 256
  sample_interval_seconds: 2
budget:
  max_wall_time_minutes: 180
  max_iterations: 50
  max_input_tokens: null
  max_output_tokens: null
  # null: provider account controls spending. Legacy value 0 blocks the Chat API.
  max_external_cost_usd: null
tools:
  # Legacy structured tools only; native commands use Codex's runtime.
  timeout_seconds: 15
  # Legacy Python worker address space only, NOT a native/Lean/Lake/WSL RAM cap.
  # See docs/resources.md (中文：docs/resources.cn.md).
  memory_mb: 512
  max_output_chars: 20000
  web_timeout_seconds: 15
  web_interval_seconds: 3
  max_download_bytes: 2000000
  lean_command: lean
verification:
  # Independent milestone checks. See docs/evidence.md (中文：docs/evidence.cn.md).
  fetch_sources: true
  max_sources: 12
  source_timeout_seconds: 60
  formal_enabled: true
  lean_command: lean
  # Prebuilt library directories relative to this project; no automatic Lake build.
  lean_library_paths: []
  formal_timeout_seconds: 120
  # Lean internal -M threshold; not a native-command or host-wide RAM cap.
  formal_memory_mb: 2048
  # OS virtual-address-space ceiling; includes reserved stacks and mapped libraries, not RSS.
  formal_address_space_mb: 8192
# Legacy structured memory only.
memory_context_chars: 16000
